[project]
name = "curry-orders"
version = "0.1.0"
description = "Curry Takeaway Ordering System — capacity-aware collection ordering + staff dashboard"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "django>=5.0,<5.1",
  "psycopg[binary]>=3.1",
  "django-storages[s3]>=1.14",
  "boto3>=1.34",
  "gunicorn>=22.0",
  "apscheduler>=3.10",
  "argon2-cffi>=23.1",
  "django-environ>=0.11",
  "sentry-sdk>=2.0",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "django-stubs>=5.0",
  "pytest>=8.2",
  "pytest-django>=4.8",
  "pytest-xdist>=3.6",
  "playwright>=1.44",
  "factory-boy>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = []

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
# core/ has no HTTP imports (§17.2) and is the mandatory strict target (§20.5 CI gate)
strict = false

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
addopts = "-ra"
