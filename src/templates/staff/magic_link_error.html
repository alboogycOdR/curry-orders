{% extends "base.html" %}

{% block title %}Sign-in link invalid — Roti Connect{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap { max-width: 420px; margin: 64px auto 0; padding: 0 32px; }
  .auth-wrap h1 { font-size: 28px; margin-bottom: var(--space-4); }
  .auth-error {
    background: var(--color-accent-2-100); color: var(--color-accent-2-800);
    border-radius: var(--radius-md); padding: var(--space-3);
    font-size: 14px; margin-bottom: var(--space-4);
  }
  .auth-back { display: block; text-align: center; font-size: 13px; margin-top: var(--space-4); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <h1>Sign-in link invalid</h1>
  <p class="auth-error">{{ error }}</p>
  <a class="auth-back" href="{% url 'manage:magic_link_begin' %}">Request a new sign-in link</a>
</div>
{% endblock %}
