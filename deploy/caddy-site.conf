# Curry Takeaway Ordering System — Clawsrv host Caddy site blocks (§17.5)
#
# Clawsrv's Caddy runs as a host systemd service and already owns 80/443
# for other tenants (e.g. admin.rwc.org.za) — this stack does NOT run its
# own caddy container. Append these two blocks to the host's
# /etc/caddy/Caddyfile, then `systemctl reload caddy`.
#
# Hostnames are placeholders — real values are an outstanding §23 owner
# input (site + media subdomains under rwc.org.za or another domain).
# WEB_BIND_PORT / MINIO_API_BIND_PORT must match .env on this host.

orders.rwc.org.za {
	reverse_proxy 127.0.0.1:8102
}

media.rwc.org.za {
	# Public dish-image bucket only. Never point a public hostname at the
	# proofs bucket — proofs are served exclusively via signed URLs
	# generated by the app (§7.13, §15).
	reverse_proxy 127.0.0.1:8103
}
