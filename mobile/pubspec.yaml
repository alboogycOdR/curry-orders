name: roti_connect
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (docs/mobile/FLUTTER_APP_PLAN.md Phase 2)
  flutter_riverpod: ^2.6.1
  # Routing — staff-only 4-tab shell (Inbox/Kitchen/Collection/More,
  # Phase 7) + full-screen pushes for everything else
  go_router: ^14.6.2
  # API client for the staff JSON API (src/staff/api_mobile*.py)
  dio: ^5.7.0
  # Persists the Django session/csrftoken cookies across requests —
  # dio has no cookie jar of its own (see lib/data/api_client.dart).
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  # Native camera/gallery picker — dish photo upload (Menu editor,
  # Phase 6). shared_preferences was removed here 2026-09-15: it only
  # ever backed the customer basket's local persistence, gone along
  # with the rest of the customer-facing app in Phase 7.
  image_picker: ^1.1.2
  # Opens the live web staff help page (/manage/help/#anchor) in the
  # device browser from the staff-mode Help screen (Phase 6) — see
  # features/staff/help/staff_help_screen.dart's own docstring for why
  # that content isn't re-ported natively.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # App icon + native splash generation (docs/mobile/FLUTTER_APP_PLAN.md
  # Phase 4 "App icon + splash screen"). Dev-only: these run codegen against
  # mobile/assets/icon/app_icon*.png and write straight into
  # android/app/src/main/res/, they aren't runtime deps of the app.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Config for `dart run flutter_launcher_icons` (android only — this app is
# Android-only, see docs/mobile/FLUTTER_APP_PLAN.md's locked decisions).
# Source artwork adapts the live site's favicon mark (src/templates/
# base_v2.html's inline SVG: navy circle + gold ring + gold arc) at
# PosterColors navy/gold (lib/theme/poster_tokens.dart) — hand-drawn with a
# Pillow script (ring + quadratic-bezier arc, not committed — see
# docs/mobile/FLUTTER_APP_PLAN.md Phase 4 for the generation notes). Legacy
# icon is full-bleed navy + gold mark;
# adaptive icon layers the same gold mark (transparent) over a navy
# background so it isn't clipped by circle/squircle OEM masks.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#071124"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Config for `dart run flutter_native_splash:create` (android only). Navy
# background (PosterColors.navy) with the same gold ring/arc mark,
# transparent, centred — mirrors the launcher icon's adaptive foreground so
# the splash-to-first-frame transition doesn't jump between two different
# marks. android_12 uses the same values (Android 12+'s own splash API only
# supports a single-colour background + centred icon, no separate "branding"
# image here).
flutter_native_splash:
  color: "#071124"
  image: "assets/icon/app_icon_foreground.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#071124"
    image: "assets/icon/app_icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Self-hosted Barlow Condensed — converted from the same .woff2 files
  # the web build uses (src/static/fonts/), via fonttools (Flutter needs
  # .ttf/.otf, not .woff2). See docs/mobile/FLUTTER_APP_PLAN.md Phase 2.
  # Re-run the conversion if the web fonts are ever updated:
  #   python -m pip install fonttools brotli
  #   python -c "from fontTools.ttLib import TTFont; f=TTFont(SRC); f.flavor=None; f.save(DST)"
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/barlow-condensed-400-normal.ttf
          weight: 400
        - asset: assets/fonts/barlow-condensed-500-normal.ttf
          weight: 500
        - asset: assets/fonts/barlow-condensed-600-normal.ttf
          weight: 600
        - asset: assets/fonts/barlow-condensed-700-normal.ttf
          weight: 700
        - asset: assets/fonts/barlow-condensed-700-italic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/barlow-condensed-800-normal.ttf
          weight: 800
        - asset: assets/fonts/barlow-condensed-900-normal.ttf
          weight: 900
